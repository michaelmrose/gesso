name: Typed Clojure assurance

on:
  push:
    branches:
      - typed-clojure
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typed-clojure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-mutation-checks:
    name: Typed source, JVM and portable Choreo gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI and Babashka
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: '1.12.0.1530'
          bb: '1.12.215'

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: typed-v1-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            typed-v1-${{ runner.os }}-

      - name: Run full opt-in Typed Clojure gate
        run: bb test:typed

      - name: Run adjacent machine, identity and integrity JVM regression tests
        run: |
          clojure -M:test \
            -n gesso.choreo.identity-test \
            -n gesso.choreo.machine-test \
            -n gesso.choreo.typed-nominal-machine-boundary-test \
            -n gesso.choreo.typed-nominal-transition-boundary-test \
            -n gesso.script.repo-integrity-metadata-test

      - name: Record JVM sparse identity transition observations
        run: |
          mkdir -p target/typed-node
          clojure -Sdeps '{:aliases {:identity-parity {:extra-paths ["test"]}}}' \
            -M:identity-parity -m gesso.choreo.typed-nominal-transition-boundary-test \
            > target/typed-node/jvm-identity-parity.log

      - name: Audit portable Choreo Node inventory and negative cases
        run: bb script/check_choreo_node_inventory.clj --self-test

      - name: Set up Node 22 for portable Choreo checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile complete portable Choreo corpus for Node
        run: |
          clojure -Sdeps '{:aliases {:typed-node {:extra-paths ["test"]}}}' \
            -M:dev:typed-node -m cljs.main \
            -co '{:target :nodejs :optimizations :none :output-dir "target/typed-node/out" :output-to "target/typed-node/choreo-corpus.js"}' \
            -c gesso.choreo.typed-nominal-transition-node-runner

      - name: Run full portable Choreo corpus under Node
        run: |
          node target/typed-node/choreo-corpus.js > target/typed-node/node-corpus.log
          grep '^GESSO_TYPED_NODE_TRANSITIONS ' target/typed-node/node-corpus.log

      - name: Compare JVM and Node identity, suspension and action boundaries
        run: |
          bb script/check_choreo_identity_parity.clj \
            target/typed-node/jvm-identity-parity.log \
            target/typed-node/node-corpus.log
