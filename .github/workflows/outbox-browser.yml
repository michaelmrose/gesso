name: Gesso outbox Chromium convergence

# A separate, GitHub-hosted execution environment is required for the
# strict EventSource -> HTMX -> authoritative DOM browser gate. Never call
# the HTTP-only readiness selection a browser result.
on:
  push:
    branches:
      - typed-clojure
    paths:
      - .github/workflows/outbox-browser.yml
      - bb.edn
      - deps.edn
      - 'src/gesso/live/**'
      - 'test/gesso/live/outbox/**'
      - 'test/gesso/live/browser/**'
      - 'resources/public/js/gesso-live.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outbox-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  concrete-host-convergence:
    name: Strict Chromium EventSource/HTMX/XTDB convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      JAVA_TOOL_OPTIONS: >-
        -Xmx3g
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --enable-native-access=ALL-UNNAMED
        -Dio.netty.tryReflectionSetAccessible=true
        -Dio.netty.noUnsafe=false
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Clojure CLI and Babashka
        uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: '1.12.0.1530'
          bb: '1.12.215'

      - name: Cache dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            .cpcache
          key: outbox-browser-v1-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            outbox-browser-v1-${{ runner.os }}-

      - name: Select an installed system Chrome without changing browser policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/outbox-browser
          for browser in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$browser" >/dev/null 2>&1; then
              resolved="$(command -v "$browser")"
              printf 'GESSO_CHROMIUM=%s\n' "$resolved" >> "$GITHUB_ENV"
              printf 'Browser: %s\n' "$resolved" | tee target/outbox-browser/browser.txt
              "$resolved" --version | tee -a target/outbox-browser/browser.txt
              exit 0
            fi
          done
          echo 'No installed system Chrome/Chromium; strict browser gate cannot run.' >&2
          exit 1

      - name: Build the production Gesso Live browser runtime
        shell: bash
        run: |
          set -euo pipefail
          bb runtime 2>&1 | tee target/outbox-browser/runtime.log
          test -s resources/public/js/gesso-live.js

      - name: Verify fail-closed gate semantics
        shell: bash
        run: |
          set -euo pipefail
          clojure -M:test -n gesso.live.outbox.browser-gate-test \
            2>&1 | tee target/outbox-browser/gate-unit.log

      - name: Check actual browser loopback navigation
        shell: bash
        run: |
          set -euo pipefail
          bb test:outbox:browser:preflight \
            2>&1 | tee target/outbox-browser/preflight.log

      - name: Verify physical HTTP/SSE/XTDB readiness (not browser convergence)
        shell: bash
        run: |
          set -euo pipefail
          bb test:outbox:browser:readiness \
            2>&1 | tee target/outbox-browser/readiness.log

      - name: Require real Chromium EventSource/HTMX/DOM convergence
        shell: bash
        run: |
          set -euo pipefail
          bb test:outbox:browser \
            2>&1 | tee target/outbox-browser/convergence.log
          # The default gate fails closed on a blocked browser, missing tests,
          # failed assertions, or runtime errors. The command is never replaced
          # with the successful HTTP-only --readiness selection.

      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: outbox-browser-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/outbox-browser/
